<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>颈椎卫士 · Tripo 树木样品</title><script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script><style>*{box-sizing:border-box}body{margin:0;background:#f3efe7;color:#37473e;font:14px system-ui,-apple-system,sans-serif}header{position:absolute;z-index:1;top:24px;left:28px;right:28px;pointer-events:none}h1{font-size:22px;margin:0 0 6px}p{margin:6px 0;color:#697469}.meta{font-size:12px}nav{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:#fffaf0eb;border:1px solid #e5dfd4;border-radius:20px}button{font:inherit;border:0;padding:12px 20px;border-radius:14px;cursor:pointer;background:#e4eadf;color:#37473e}button:hover,button[aria-pressed=true]{background:#587a67;color:white}button:focus-visible{outline:3px solid #bca56b;outline-offset:2px}#status{position:absolute;left:28px;bottom:30px;max-width:25%;font-size:12px}canvas{display:block;width:100vw;height:100vh}#error{color:#ad493b}</style></head><body><header><h1>湖畔树木 · Tripo 样品</h1><p>拖拽旋转 · 滚轮拉近查看细节</p><p class="meta">H3.1 · 精细形体与贴图 · 实际模型预览</p><p id="error" role="alert"></p></header><div id="status" role="status">正在加载模型…</div><nav aria-label="查看模型部位"><button data-view="tree" aria-pressed="true">整树</button><button data-view="trunk" aria-pressed="false">树干细节</button><button data-view="crown" aria-pressed="false">树冠细节</button><button id="rotate" aria-pressed="false">自动旋转</button></nav><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#f3efe7');const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=.12;controls.maxDistance=15;controls.autoRotateSpeed=.7;
scene.add(new THREE.HemisphereLight(0xfffaf2,0xb6c0a4,2.3));const key=new THREE.DirectionalLight(0xfff3df,3);key.position.set(4,7,5);scene.add(key);const fill=new THREE.DirectionalLight(0xe1eff0,1.2);fill.position.set(-4,3,-3);scene.add(fill);
let width=1,height=1;let loaded=false;window.modelReady=false;
function view(name){const target=name==='trunk'?new THREE.Vector3(0,height*.2,0):name==='crown'?new THREE.Vector3(0,height*.72,0):new THREE.Vector3(0,height*.5,0);const distance=name==='trunk'?height*.4:name==='crown'?height*.8:Math.max(width,height)*1.75;controls.target.copy(target);camera.position.copy(target).add(new THREE.Vector3(.45,.12,1).normalize().multiplyScalar(distance));controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));}
try {const response=await fetch('../environments/v2/sample-preview.json');if(!response.ok)throw Error('样品尚未就绪');const info=await response.json();const gltf=await new GLTFLoader().loadAsync(new URL(info.model,location.href).href);const model=gltf.scene;let box=new THREE.Box3().setFromObject(model);const size=box.getSize(new THREE.Vector3());const max=Math.max(size.x,size.y,size.z);if(!Number.isFinite(max)||max<=0)throw Error('模型范围无效');model.scale.multiplyScalar(3/max);box=new THREE.Box3().setFromObject(model);const center=box.getCenter(new THREE.Vector3());model.position.sub(new THREE.Vector3(center.x,box.min.y,center.z));scene.add(model);box=new THREE.Box3().setFromObject(model);height=box.max.y-box.min.y;width=Math.max(box.max.x-box.min.x,box.max.z-box.min.z);view('tree');loaded=true;window.modelReady=true;document.querySelector('#status').textContent=`${info.triangles.toLocaleString()} 个三角面 · ${info.textureSummary} · 仅模型预览，尚未替换应用场景`;}
catch(e){document.querySelector('#error').textContent='无法加载样品：'+e.message;document.querySelector('#status').textContent='加载未完成';console.error(e);}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(loaded)view(b.dataset.view)});document.querySelector('#rotate').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.setAttribute('aria-pressed',String(controls.autoRotate))};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
